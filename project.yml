name: BetterPlayer

options:
  bundleIdPrefix: pl.konbini
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  DesignSystem:
    path: Packages/DesignSystem

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "96A754WM9L" # Apple Developer team (FILIP MICHAL BLASZCZYK)
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BetterPlayer:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DesignSystem
        product: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.konbini.betterplayer
        PRODUCT_NAME: BetterPlayer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Better Player
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: "Better Player uses Apple Music to play and organize your library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

name: BetterPlayer

options:
  bundleIdPrefix: pl.konbini
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "96A754WM9L" # Apple Developer team (FILIP MICHAL BLASZCZYK)
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BetterPlayer:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.konbini.betterplayer
        PRODUCT_NAME: BetterPlayer
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Better Player
        # Empty launch screen → plain background (no asset dependency).
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: "Better Player uses Apple Music to show and play your library and playlists."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
